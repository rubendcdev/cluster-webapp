{% extends "layout.html" %}
{% block title %}Acceso{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="auth-card row g-0 switchable {% if mode=='register' %}mode-register{% endif %}">

        <!-- Left -->
        <div class="col-lg-5 d-none d-lg-flex auth-hero flex-column justify-content-between">
          <div>
            <h1>Bienvenido</h1>
            <p class="mt-3">
              Accede a la plataforma institucional de forma segura.
            </p>
          </div>

          <div>
            <p class="mb-2 text-white-50">Continuar con</p>
            <button class="btn btn-google w-100" type="button">
              <img src="/static/images/Google.png" alt="Google">
              Google
            </button>
          </div>
        </div>

        <!-- Right -->
        <div class="col-lg-7 bg-white">
          <div class="auth-form">

            <!-- LOGIN -->
            <div class="panel-login">
              <h1>Iniciar sesión</h1>

              <form method="post" class="form-underline">
                <div class="mb-4">
                  <label class="form-label">Correo electrónico</label>
                  <input type="email" name="correo" class="form-control" required>
                </div>

                <div class="mb-4">
                  <label class="form-label">Contraseña</label>
                  <input type="password" name="password" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember">
                    <label class="form-check-label">Recordarme</label>
                  </div>
                  <button class="btn btn-primary-auth">Ingresar</button>
                </div>
              </form>

              <p class="small">
                ¿No tienes cuenta?
                <a href="#" class="toggle-link link-auth" data-target="register">
                  Regístrate
                </a>
              </p>
            </div>

            <!-- REGISTER -->
            <!-- REGISTER -->
            <div class="panel-register">
              <h1>Crear cuenta</h1>

              <form method="post" action="/register" class="form-underline">

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Nombre</label>
                    <input name="nombre" class="form-control" required>
                  </div>

                  <div class="col-md-4 mb-3">
                    <label class="form-label">Apellido paterno</label>
                    <input name="apellido_paterno" class="form-control" required>
                  </div>

                  <div class="col-md-4 mb-3">
                    <label class="form-label">Apellido materno</label>
                    <input name="apellido_materno" class="form-control">
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" name="correo" class="form-control" required>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" name="telefono" class="form-control" placeholder="Opcional">
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" minlength="6" required>
                  </div>

                  <div class="col-md-6 mb-4">
                    <label class="form-label">Confirmar contraseña</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="6" required>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <a href="#" class="toggle-link link-auth" data-target="login">
                    ¿Ya tienes cuenta?
                  </a>
                  <button class="btn btn-primary-auth">
                    Registrarme
                  </button>
                </div>

              </form>
            </div>


          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const container = document.querySelector('.switchable');
  document.querySelectorAll('.toggle-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      container.classList.toggle('mode-register');
    });
  });
</script>
{% endblock %}
