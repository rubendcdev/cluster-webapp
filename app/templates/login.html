{% extends "layout.html" %}
{% block title %}Acceso{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="auth-card row g-0 switchable {% if mode=='register' %}mode-register{% endif %}">

        <!-- Left -->
        <div class="col-lg-5 d-none d-lg-flex auth-hero flex-column justify-content-between">
          <div>
            <h1>Bienvenido</h1>
            <p class="mt-3">
              Accede a la plataforma institucional de forma segura.
            </p>
          </div>

          <div>
            <p class="mb-2 text-white-50">Continuar con</p>
            <button class="btn btn-google w-100" type="button">
              <img src="/static/images/Google.png" alt="Google">
              Google
            </button>
          </div>
        </div>

        <!-- Right -->
        <div class="col-lg-7 bg-white">
          <div class="auth-form">

            <!-- LOGIN -->
            <div class="panel-login">
              <h1>Iniciar sesión</h1>

              <form method="post" class="form-underline">
                <div class="mb-4">
                  <label class="form-label">Correo electrónico</label>
                  <input type="email" name="correo" class="form-control" required>
                </div>

                <div class="mb-4">
                  <label class="form-label">Contraseña</label>
                  <input type="password" name="password" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember">
                    <label class="form-check-label">Recordarme</label>
                  </div>
                  <button class="btn btn-primary-auth">Ingresar</button>
                </div>
              </form>

              <p class="small">
                ¿No tienes cuenta?
                <a href="#" class="toggle-link link-auth" data-target="register">
                  Regístrate
                </a>
              </p>
            </div>

            <!-- REGISTER -->
            <div class="panel-register">
              <h1>Crear cuenta</h1>

              <form method="post" action="/register" class="form-underline">

                <!-- Modern Role Selector -->
                <div class="role-selector-container">
                  <div class="role-slider" id="role_slider"></div>
                  <div class="role-option active" data-role="user">Usuario Regular</div>
                  <div class="role-option" data-role="asociado">Empresa / Asociado</div>
                  <input type="hidden" name="role" id="role_input" value="user">
                </div>

                <div class="field-group-container">
                  <!-- Campos de Usuario Regular -->
                  <div id="user_fields" class="field-group">
                    <div class="row">
                      <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input name="nombre" class="form-control" id="reg_nombre" placeholder="Juan">
                      </div>

                      <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido paterno</label>
                        <input name="apellido_paterno" class="form-control" id="reg_paterno" placeholder="Pérez">
                      </div>

                      <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido materno</label>
                        <input name="apellido_materno" class="form-control" placeholder="García">
                      </div>
                    </div>
                  </div>

                  <!-- Campos de Asociado -->
                  <div id="asociado_fields" class="field-group hidden" style="display: none;">
                    <div class="mb-3">
                      <label class="form-label">Nombre de la Empresa / Asociación</label>
                      <input name="nombre_empresa" class="form-control" id="reg_empresa"
                        placeholder="Nombre de tu organización">
                    </div>
                  </div>
                </div>

                <!-- Campos Comunes con Animación -->
                <div id="common_fields" class="field-group">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Correo electrónico</label>
                      <input type="email" name="correo" class="form-control" required placeholder="correo@ejemplo.com">
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label">Teléfono</label>
                      <input type="tel" name="telefono" class="form-control" placeholder="123 456 7890 (Opcional)">
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label">Contraseña</label>
                      <input type="password" name="password" class="form-control" minlength="6" required
                        placeholder="mín. 6 caracteres">
                    </div>

                    <div class="col-md-6 mb-4">
                      <label class="form-label">Confirmar contraseña</label>
                      <input type="password" name="confirm_password" class="form-control" minlength="6" required
                        placeholder="repite tu contraseña">
                    </div>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                  <a href="#" class="toggle-link link-auth" data-target="login">
                    ¿Ya tienes cuenta?
                  </a>
                  <button class="btn btn-primary-auth">
                    Registrarme
                  </button>
                </div>

              </form>
            </div>


          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const container = document.querySelector('.switchable');
  document.querySelectorAll('.toggle-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      container.classList.toggle('mode-register');
    });
  });

  // Lógica para el selector de rol moderno con animaciones
  const roleOptions = document.querySelectorAll('.role-option');
  const roleSlider = document.getElementById('role_slider');
  const roleInput = document.getElementById('role_input');
  const userFields = document.getElementById('user_fields');
  const asociadoFields = document.getElementById('asociado_fields');
  const commonFields = document.getElementById('common_fields');

  const inputNombre = document.getElementById('reg_nombre');
  const inputPaterno = document.getElementById('reg_paterno');
  const inputEmpresa = document.getElementById('reg_empresa');

  roleOptions.forEach(option => {
    option.addEventListener('click', () => {
      const role = option.getAttribute('data-role');
      if (roleInput.value === role) return; // Evitar disparar si ya está seleccionado

      // Actualizar UI del selector
      roleOptions.forEach(opt => opt.classList.remove('active'));
      option.classList.add('active');

      // Animación de salida para todos los campos
      userFields.classList.add('hidden');
      asociadoFields.classList.add('hidden');
      commonFields.classList.add('hidden');

      setTimeout(() => {
        // Mover el slider
        if (role === 'asociado') {
          roleSlider.style.transform = 'translateX(100%)';
          roleInput.value = 'asociado';

          userFields.style.display = 'none';
          asociadoFields.style.display = 'block';

          inputNombre.required = false;
          inputPaterno.required = false;
          inputEmpresa.required = true;
        } else {
          roleSlider.style.transform = 'translateX(0)';
          roleInput.value = 'user';

          asociadoFields.style.display = 'none';
          userFields.style.display = 'block';

          inputNombre.required = true;
          inputPaterno.required = true;
          inputEmpresa.required = false;
        }

        // Animación de entrada para los campos correspondientes
        setTimeout(() => {
          if (role === 'asociado') {
            asociadoFields.classList.remove('hidden');
          } else {
            userFields.classList.remove('hidden');
          }
          commonFields.classList.remove('hidden');
        }, 50);

      }, 400);
    });
  });

  // Inicialización
  inputNombre.required = true;
  inputPaterno.required = true;
  inputEmpresa.required = false;
</script>
{% endblock %}
