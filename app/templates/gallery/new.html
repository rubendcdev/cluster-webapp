{% extends "layout.html" %}
{% block title %}Agregar imagen a galería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow">
            <div class="card-header text-white" style="background-color: #2c3e50;">
                <h4 class="mb-0">
                    <i class="bi bi-image me-2"></i>Agregar imagen a la galería
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">Título *</label>
                        <input type="text" class="form-control" id="title" name="title" required maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Descripción</label>
                        <textarea class="form-control" id="description" name="description" rows="3" maxlength="500"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">Imagen *</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                        <div class="form-text">Formatos permitidos: PNG, JPG, JPEG, GIF, WebP.</div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('public.gallery') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Volver a galería
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar imagen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
